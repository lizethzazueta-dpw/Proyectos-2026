<head>

    <link rel="stylesheet" href="stylesheet.css">
    <link rel="stylesheet" href="datospedido.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="icon" type="image/png" href="IMAGENES/JUGO_SILUETA.png">
</head>

<body>

    <!-- NAVEGACION -->
    <nav>
        <a href="index.html" class="navbar-item">
            <img src="IMAGENES/LOGO NATIVA.png" alt="Logo NATIVA">
        </a>

        <div class="topnav" id="myTopnav">
            <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>

    <main>
        <section class="seccion-formulario">
            <h2>DATOS DEL PEDIDO</h2>

            <form class="form-pedido" action="pago.html">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" required>

                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" name="telefono" required>

                <label for="direccion">Dirección</label>
                <input type="text" id="direccion" name="direccion" required>

                <label for="instrucciones">Instrucciones de entrega</label>
                <textarea id="instrucciones" name="instrucciones" rows="4"></textarea>

                <p class="label-entrega">Forma de entrega</p>
                <div class="opciones-entrega">
                    <label class="radio-opcion">
                        <input type="radio" name="entrega" value="tienda" checked>
                        Recoger en tienda
                    </label>

                    <label class="radio-opcion">
                        <input type="radio" name="entrega" value="envio">
                        Envío
                    </label>
                </div>

                <div class="contenedor-boton">
                    <button type="submit" class="btn-confirmar">Confirmar pedido</button>
                </div>
            </form>
        </section>
    </main>

     <!-- FOOTER -->
                <footer> 

                  <section id="club-nativa">

                    <div class="contenedor-registro">

                    <div class="footer-imagen">
                      <img src="IMAGENES/CLUB_NATIVA.png" alt="Club Nativa">
                     </div>

                    <div class="footer-texto">
                          <h2>JOIN OUR</h2>
                          <h2>NATIVAAAS CLUB</h2>
                         <p>
                            ¡Regístrate y empieza a disfrutar de los beneficios de ser parte de NATIVA!
                         </p>
                    <div class="button regitrarse">
                    <a href="#">Regístrate</a>
                  </div>
                  
                    </div>

          </section>

    <div>
        <h4>@NATIVA.JUICE</h4>
    </div>

    <div>
        <h3>NATIVA</h3>
        <p>Natural. Fresco. A tu manera.</p>
    </div>
